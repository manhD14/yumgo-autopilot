<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yumgo Shipper Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pr:#D9822B;--prd:#B5661A;--pr2:#955210;--bg:#EAF4FB;--sky:#D2E7F5;--tx:#2E2A26;--mu:#5F7080;--bd:#C6DDEE;--ok:#2E9E5B;--okb:#E4F6EB;--wr:#B57A00;--wrb:#FFF3D0;--er:#D93A3A;--erb:#FDE5E5;--bl:#2F6FDB;--blb:#E3EDFD;--pu:#7B4FD6;--pub:#EEE7FB}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh;font-size:14px}
aside{width:220px;background:var(--pr);color:#fff;box-shadow:2px 0 12px #D9822B44;padding:16px 12px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-weight:800;font-size:22px;color:#fff}.logo img,.logo i{width:44px;height:44px;object-fit:cover;border-radius:12px;border:2px solid #fff;background:#fff;color:var(--prd);display:grid;place-items:center;font-style:normal}
aside a{display:block;padding:10px 12px;border-radius:9px;color:#fff;cursor:pointer;margin-bottom:6px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px;text-shadow:0 1px 1px #0002}aside a:hover{background:#ffffff33}aside a.on{background:#fff;color:var(--pr2);text-shadow:none;box-shadow:0 2px 8px #0002}
.ic{width:34px;height:34px;border-radius:10px;background:var(--sky);border:2px solid #fff;display:grid;place-items:center;font-size:17px;flex-shrink:0;text-shadow:none}aside a.on .ic{background:var(--pr);border-color:var(--prd)}
main{flex:1;padding:20px 24px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}h1{margin:0;font-size:22px}h3{margin:0 0 10px}
.wb{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--bd);padding:5px 8px;border-radius:10px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.kpi{background:#fff;border-top:3px solid var(--pr);border:1px solid var(--bd);border-radius:12px;padding:12px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--mu);font-size:12px}
.b{border:1px solid var(--bd);background:#fff;color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}.b:hover{border-color:var(--pr);background:var(--sky)}.b.pr{background:var(--prd);color:#fff;border-color:var(--prd)}.b.pr:hover{background:var(--pr2)}.b.dg{color:var(--er)}
table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mu);background:#F4F9FD}
.bd{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#eee;color:#666}.bd.ok{background:var(--okb);color:var(--ok)}.bd.wr{background:var(--wrb);color:var(--wr)}.bd.er{background:var(--erb);color:var(--er)}.bd.bl{background:var(--blb);color:var(--bl)}.bd.pu{background:var(--pub);color:var(--pu)}
.sc td{width:12%;cursor:pointer;border:1px solid var(--bd);height:74px;font-size:12px}.sc td:hover{outline:2px solid var(--pr)}.sc .ok{background:var(--okb)}.sc .short{background:var(--erb)}.sc .ovr{background:var(--pub)}.sc th:first-child{width:90px}
.chip{display:block;font-weight:700}.sm{font-size:11px;color:var(--mu)}
.bar{height:8px;background:var(--sky);border-radius:9px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--pr)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab{padding:7px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;cursor:pointer;font:inherit}.tab.on{background:var(--prd);color:#fff;border-color:var(--prd)}
.av{width:56px;height:38px;font-size:18px;border-radius:8px;border:1px solid var(--bd);background:#fff;cursor:pointer}.av.P{background:#FFE9A8}.av.A{background:var(--okb)}.av.U{background:var(--erb)}
.iss{padding:8px 10px;border-radius:8px;margin-bottom:6px}.iss.r{background:var(--erb)}.iss.y{background:var(--wrb)}.iss.p{background:var(--pub)}.iss.g{background:var(--okb)}
#ov{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:9}#md{background:#fff;border-radius:14px;padding:20px;width:min(560px,94vw);max-height:90vh;overflow:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:var(--mu);font-weight:700}input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit;margin-top:3px}
.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.rw{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:10}#toast div{background:#2F3E4E;color:#fff;padding:10px 14px;border-radius:9px}#toast .er{background:var(--er)}
.pic{border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;flex:none}img.pic[data-sid]{cursor:zoom-in}#lb{position:fixed;inset:0;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;color:#fff;gap:10px}#lb img{max-width:92vw;max-height:82vh;border-radius:14px;border:4px solid #fff;background:#fff}
#dg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:30}.dbox{background:#fff;border-radius:14px;padding:20px;width:min(440px,92vw);border-top:4px solid var(--pr)}
.pic.d{display:inline-grid;place-items:center;background:var(--sky);color:var(--prd);font-weight:800;border:1px solid var(--bd)}
.pl{max-height:200px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin-top:3px}.po{display:flex;align-items:center;padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--bd)}.po:hover{background:var(--sky)}.po.on{background:#FCEBD5;outline:2px solid var(--pr);outline-offset:-2px}
.avbox{display:flex;gap:14px;align-items:center;border:2px dashed var(--bd);border-radius:12px;padding:12px;grid-column:1/-1}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bsel{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--tx);margin:0}.bsel select{width:auto;margin:0;padding:6px 8px;font-weight:700}
@media(max-width:800px){aside{width:64px}aside a b,.logo span{display:none}aside a{justify-content:center;padding:8px 0}main{padding:12px}}
.vt{display:flex;justify-content:flex-end;margin-bottom:8px}.vt .b{font-size:12px;padding:5px 10px}
.mc{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--pr);border-radius:12px;padding:10px 12px;margin-bottom:10px}.mc.ok{border-left-color:var(--ok);background:var(--okb)}.mc.short{border-left-color:var(--er);background:var(--erb)}.mc.ovr{border-left-color:var(--pu);background:var(--pub)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;font-size:16px}.mp{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:15px}.mb{display:flex;gap:6px}
/* ===== Giao diện điện thoại (bật bằng nút 📱, tự bật khi màn hình hẹp) ===== */
body.mob{display:block;font-size:15px;padding-bottom:78px}
body.mob aside{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));z-index:8;box-shadow:0 -2px 12px #0003}
body.mob .logo{display:none}body.mob #nav{display:flex;justify-content:space-around;gap:2px}
body.mob aside a{flex:1;flex-direction:column;gap:2px;padding:4px 2px;margin:0;font-size:10.5px;text-align:center;justify-content:center;border-radius:10px;min-width:0}
body.mob aside a b{display:block;line-height:1.1}body.mob .ic{width:30px;height:30px;font-size:16px}
body.mob main{padding:10px;max-width:560px;margin:0 auto}body.mob h1{font-size:19px}body.mob .top{margin-bottom:10px}
body.mob .wb{width:100%;flex-wrap:wrap;justify-content:space-between}body.mob .bsel{width:100%}body.mob .bsel select{flex:1;width:100%}
body.mob .card{padding:10px}body.mob .b,body.mob .tab{padding:10px 12px;min-height:42px}body.mob .acts .b{flex:1 1 auto}body.mob .vt .b{min-height:0;padding:6px 10px}
body.mob .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}body.mob .tab{flex:0 0 auto;text-align:center;line-height:1.25}
body.mob .grid{grid-template-columns:repeat(2,1fr);gap:8px}body.mob .kpi b{font-size:22px}
body.mob .fg{grid-template-columns:1fr !important}body.mob #md{width:96vw;padding:14px;max-height:92vh}body.mob input,body.mob select,body.mob textarea{font-size:16px}
body.mob #bn .iss{font-size:12px;padding:6px 8px;margin-bottom:8px}body.mob #bn .b,body.mob #bn .acts .b{min-height:0;padding:5px 8px;font-size:12px;flex:none}body.mob .acts .b{font-size:13px;padding:8px 10px;min-height:38px}summary{cursor:pointer;padding:2px 0}
body.mob #toast{left:10px;right:10px;bottom:84px}body.mob .mb .av{flex:1;width:auto;height:60px;font-size:20px;line-height:1.25}
</style></head><body>

<script>
/* ===== 1. HELPERS & DATE ===== */
const K='yumgo_shipper_v1',DN=['T2','T3','T4','T5','T6','T7','CN'];
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pd=s=>new Date(s+'T00:00:00'),addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const mon=d=>{d=new Date(d);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const weekDates=w=>[...Array(7)].map((_,i)=>addD(w,i)),fd=s=>s.slice(8)+'/'+s.slice(5,7);
const uid=p=>p+Math.random().toString(36).slice(2,8),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);let S,ui={view:'dash',week:mon(new Date()),day:0};

/* ===== 2a. TÒA NHÀ (nhiều tòa nhà ở các khu khác nhau) =====
 • Mỗi tòa có DANH SÁCH SHIPPER riêng (shipper.bid), lịch rảnh, lịch xếp (entry có e.bid) và trạng thái Draft/Published/Locked riêng. Chỉ ca (shifts) và cấu hình chung.
 • Dữ liệu cũ (không có bid) thuộc tòa mặc định B1; khoá lịch rảnh của B1 giữ nguyên định dạng cũ "ngày|shipper|ca", tòa khác thêm hậu tố "|idTòa".
 • Shipper chỉ được xếp trong tòa của mình (chk báo vi phạm nếu entry thuộc tòa khác). */
const B0='B1',bOf=e=>e.bid||B0;
function normS(){if(!S)return;S.avail=S.avail||{};S.schedule=S.schedule||[];S.weeks=S.weeks||{};S.log=S.log||[];S.adj=S.adj||[];S.payLock=S.payLock||{};S.payMod=S.payMod||{};S.payAdd=S.payAdd||[];S.notices=S.notices||[];S.evDone=S.evDone||{};S.autoDone=S.autoDone||{};S.regLog=S.regLog||{};S.settings=S.settings||{};{const st=S.settings;if(st.rate===undefined)st.rate=40000;if(st.rateB===undefined)st.rateB=0;if(st.late===undefined)st.late=24;if(st.gc===undefined)st.gc=2}
 if(!Array.isArray(S.buildings)||!S.buildings.length)S.buildings=[{id:B0,name:'Tòa nhà chính',address:'',contact:'',phone:'',note:'',active:true,createdAt:iso(new Date())}]}
const bName=id=>(S.buildings.find(b=>b.id==id)||{name:'(đã xóa)'}).name;
function CB(){const id=ui.bld||meta.bld,a=S.buildings.filter(b=>b.active);return(S.buildings.find(b=>b.id==id&&b.active)||a[0]||S.buildings[0]).id}
const setBld=id=>{ui.bld=id;meta.bld=id;saveMeta();render()};
const bSlug=()=>bName(CB()).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'toa-nha';
const avk=(d,sid,shid,b)=>{b=b||CB();return d+'|'+sid+'|'+shid+(b==B0?'':'|'+b)},kBld=k=>k.split('|')[3]||B0;
// số ca primary của shipper trong tuần chứa ngày d ở CÁC TÒA KHÁC (để tính chung Daily/Weekly Max & cân bằng ca)
const sBid=s=>s.bid||B0,bShippers=()=>{const cb=CB();return S.shippers.filter(s=>sBid(s)==cb)}; // mỗi shipper thuộc đúng 1 tòa nhà (shipper cũ chưa có bid → tòa mặc định)
const xw=(sid,d)=>{if(S.buildings.length<2)return 0;const a=mon(d),z=addD(a,6),cb=CB(),s0=S.shippers.find(y=>y.id==sid),ids=s0?sibIds(s0):[sid];return S.schedule.filter(x=>x.role=='primary'&&ids.includes(x.shipperId)&&x.date>=a&&x.date<=z&&bOf(x)!=cb).length};

/* ===== 2. STORAGE & DEMO DATA ===== */
function demo(){
 const s={settings:{wt:5,dm:2,wm:null,allow:true,gc:2,rate:40000,rateB:0,late:24},shippers:[['Nguyễn Minh','0901000001'],['Trần Nam','0901000002'],['Lê Hoàng','0901000003']].map((x,i)=>({id:'S'+(i+1),name:x[0],phone:x[1],avatar:'',thumb:'',active:true,weeklyTarget:5,weeklyMax:null,dailyMax:2,note:'',createdAt:iso(new Date())})),
 shifts:[['11h','10:00','10:00','11:00'],['12h','11:00','11:00','12:00'],['18h','17:00','17:00','18:00'],['19h','18:00','18:00','19:00']].map(x=>({id:'C'+x[0],name:x[0],orderCutoff:x[1],deliveryStart:x[2],deliveryEnd:x[3],requiredShippers:1,active:true})),
 avail:{},schedule:[],weeks:{},log:[]};const w0=mon(new Date());
 for(let w=0;w<4;w++)for(let d=0;d<7;d++)s.shippers.forEach((sp,i)=>s.shifts.forEach((sh,k)=>{const r=(i*3+d*2+k)%7;s.avail[addD(w0,w*7+d)+'|'+sp.id+'|'+sh.id]=(r==0||(d==6&&i!=0))?'U':r==1?'P':'A'}));
 return s}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}if(!S)S=demo();normS()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Không lưu được dữ liệu','er')}meta.dirty=(meta.dirty||0)+1;saveMeta();pushFile();cloudMark();pubMark()}
const commit=()=>{save();render()};
const log=m=>{S.log.push({t:new Date().toISOString(),m});S.log=S.log.slice(-500)};
function toast(m,c){const d=document.createElement('div');d.textContent=m;d.className=c||'';$('#toast').append(d);setTimeout(()=>d.remove(),4000)}

/* ===== 2b. AVATAR ===== (chỉ để nhận diện, KHÔNG dùng trong thuật toán xếp lịch)
 avatar = ảnh ≤500px (JPEG), thumb = ảnh vuông 64px cho danh sách/lịch để nhẹ DOM. */
const ini=n=>{const w=String(n).trim().split(/\s+/);return((w[0][0]||'')+(w.length>1?w[w.length-1][0]:'')).toUpperCase()};
const picOf=(src,name,sz,sid)=>src?`<img class=pic src="${src}" width=${sz} height=${sz} alt="" ${sid?`data-sid="${sid}" title="Bấm để xem ảnh lớn"`:''}>`:`<span class="pic d" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.4)}px">${esc(ini(name))}</span>`;
const pic=(id,sz)=>{const s=S.shippers.find(x=>x.id==id);return s?picOf(sz>48?s.avatar:(s.thumb||s.avatar),s.name,sz,s.id):picOf('','?',sz)};
function procImg(f){return new Promise((ok,no)=>{
 if(!/^image\/(jpeg|png|webp)$/.test(f.type))return no('Chỉ hỗ trợ ảnh JPG, JPEG, PNG, WEBP');
 if(f.size>2*1048576)return no(`Ảnh quá lớn (${(f.size/1048576).toFixed(1)}MB). Giới hạn tối đa 2MB — vui lòng chọn ảnh nhỏ hơn`);
 const r=new FileReader();r.onerror=()=>no('Không đọc được ảnh');r.onload=()=>{const im=new Image();im.onerror=()=>no('File ảnh không hợp lệ');im.onload=()=>{
  const W=im.width,H=im.height,k=Math.min(1,500/Math.max(W,H)),m=Math.min(W,H);
  const mk=(w,h,sx,sy,sw,sh,q)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,sx,sy,sw,sh,0,0,w,h);return c.toDataURL('image/jpeg',q)};
  ok({avatar:mk(Math.round(W*k),Math.round(H*k),0,0,W,H,.8),thumb:mk(64,64,(W-m)/2,(H-m)/2,m,m,.75)})};im.src=r.result};r.readAsDataURL(f)})}
function sizeWarn(){const n=JSON.stringify(S).length;if(n>3.5e6)toast(`⚠️ Dữ liệu đã ~${(n/1048576).toFixed(1)}MB, gần giới hạn localStorage (~5MB). Hãy backup JSON và hạn chế số ảnh.`,'er')}
$('#avf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 procImg(f).then(d=>{if(ui.avT=='form'){ui.av=d;showPrev()}else{Object.assign(S.shippers.find(x=>x.id==ui.avT),d);commit();profile(ui.avT)}sizeWarn()},m=>toast(m,'er'))};
const showPrev=()=>$('#av_prev').innerHTML=picOf(ui.av.avatar,$('#f_n').value||'?',96);
const clrAv=()=>{ui.av={avatar:'',thumb:''};showPrev()};
function clrPA(id){ask('Xóa ảnh của shipper này?',()=>{const s=S.shippers.find(x=>x.id==id);s.avatar='';s.thumb='';commit();profile(id);toast('Đã xóa ảnh')},{ok:'Xóa ảnh'})}
function profile(id){const s=S.shippers.find(x=>x.id==id),c=weekEntries(ui.week).filter(e=>e.role=='primary'&&e.shipperId==id).length+xw(id,ui.week);
 modal(`<div style="text-align:center">${picOf(s.avatar,s.name,140,s.id)}<h3 style="margin:10px 0 4px">${esc(s.name)}</h3><span class="bd ${s.active?'ok':''}">● ${s.active?'ACTIVE':'INACTIVE'}</span></div>
 <div style="margin:14px auto;max-width:300px;line-height:1.9">📞 ${esc(s.phone)||'—'}<br>📅 Target: ${s.weeklyTarget} ca/tuần<br>📊 Tuần này: ${c} ca<br>Daily Max: ${s.dailyMax}<br>Weekly Max: ${s.weeklyMax??'Unlimited'}${s.note?'<br>📝 '+esc(s.note):''}</div>
 <div class=ac style="justify-content:center"><button class=b onclick="ui.avT='${id}';$('#avf').click()">📷 Đổi ảnh</button><button class="b dg" onclick="clrPA('${id}')">Xóa ảnh</button><button class=b onclick="shipForm('${id}')">Sửa</button><button class=b onclick=closeModal()>Đóng</button></div>`)}
/* Lightbox: bấm avatar bất kỳ (capture phase, không kích hoạt click của ô lịch bên dưới) để xem ảnh lớn */
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('img.pic[data-sid]');if(!t)return;

/* ===== 2d. BACKUP & FILE SYNC =====
 localStorage gắn với TỪNG trình duyệt/máy nên đổi trình duyệt sẽ thấy dữ liệu trống. Cách khắc phục không cần server:
 (1) Tự động lưu ra 1 file .json trên máy (File System Access API: Chrome/Edge), mở lại file đó ở trình duyệt khác;
 (2) Sao lưu / khôi phục bằng JSON (mọi trình duyệt). */
let meta={};try{meta=JSON.parse(localStorage.getItem(K+'_meta'))||{}}catch(e){}
const saveMeta=()=>{try{localStorage.setItem(K+'_meta',JSON.stringify(meta))}catch(e){}};
let fh=null,fhState='none',wt;const FT=[{description:'Yumgo data',accept:{'application/json':['.json']}}];
const idb=(m,v)=>new Promise(r=>{try{const q=indexedDB.open('yumgo_fs',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');q.onsuccess=()=>{const t=q.result.transaction('h',m=='get'?'readonly':'readwrite'),s=t.objectStore('h'),x=m=='get'?s.get('fh'):m=='set'?s.put(v,'fh'):s.delete('fh');x.onsuccess=()=>r(x.result);x.onerror=()=>r(null)};q.onerror=()=>r(null)}catch(e){r(null)}});
async function writeNow(){const w=await fh.createWritable();await w.write(JSON.stringify(S));await w.close();meta.lastFile=Date.now();meta.dirty=0;saveMeta()}
function pushFile(){if(!fh||fhState!='ready')return;clearTimeout(wt);wt=setTimeout(async()=>{try{await writeNow();updBar()}catch(e){fhState='needperm';updBar();toast('Không ghi được file dữ liệu — cần cấp quyền lại','er')}},700)}
const fsErr=e=>{if(e&&e.name=='AbortError')return;toast(e&&e.message=='bad'?'File không đúng định dạng dữ liệu Yumgo':'Trình duyệt/khung xem này không cho truy cập file — hãy dùng Sao lưu JSON','er')};
async function linkNew(){try{const h=await showSaveFilePicker({suggestedName:'yumgo-data.json',types:FT});fh=h;fhState='ready';await idb('set',h);await writeNow();render();toast('Đã bật tự động lưu vào file '+h.name)}catch(e){fsErr(e)}}
async function linkOpen(){try{const [h]=await showOpenFilePicker({types:FT});const j=JSON.parse(await(await h.getFile()).text());if(!j.shippers||!j.shifts||!j.schedule||!j.settings)throw new Error('bad');
 ask(`Tải dữ liệu từ file "${h.name}" và thay thế dữ liệu hiện có trong trình duyệt này? Từ giờ mọi thay đổi sẽ tự lưu vào file đó.`,async()=>{try{if(await h.requestPermission({mode:'readwrite'})!='granted')return toast('Cần cấp quyền ghi file','er');
  S={avail:{},weeks:{},log:[],...j};normS();fh=h;fhState='ready';await idb('set',h);commit();meta.dirty=0;saveMeta();updBar();toast('Đã tải dữ liệu và bật tự động lưu file')}catch(e){fsErr(e)}},{ok:'Tải & liên kết'})}catch(e){fsErr(e)}}
async function reperm(){try{if(await fh.requestPermission({mode:'readwrite'})=='granted'){fhState='ready';await writeNow();render()}}catch(e){fsErr(e)}}
const unlink=()=>{idb('del');fh=null;fhState='none';render()};
async function initFile(){if(!('showSaveFilePicker' in window))return;const h=await idb('get');if(!h)return;fh=h;try{fhState=(await h.queryPermission({mode:'readwrite'}))=='granted'?'ready':'needperm'}catch(e){fhState='needperm'}updBar()}
function fsBtns(){return`<button class="b pr" onclick=expJSON()>💾 Sao lưu ngay</button>`+('showSaveFilePicker' in window?`<button class=b onclick=linkNew()>🔗 Tự động lưu ra file</button><button class=b onclick=linkOpen()>📂 Mở file dữ liệu</button>`:`<button class=b onclick="$('#imp').click()">📂 Khôi phục từ file JSON</button>`)}
function barInner0(){
 if(fh&&fhState=='ready')return`<div class="iss g">✅ Tự động lưu vào file <b>${esc(fh.name)}</b>${meta.lastFile?' · lần cuối '+new Date(meta.lastFile).toLocaleTimeString('vi-VN'):''} <button class=b onclick=unlink()>Ngắt liên kết</button></div>`;
 if(fh)return`<div class="iss y">⚠️ Cần cấp quyền ghi lại cho file <b>${esc(fh.name)}</b> để tiếp tục tự động lưu. <button class="b pr" onclick=reperm()>Cấp quyền</button></div>`;
 if(meta.cloud||!(meta.dirty>0))return'';
 return`<div class="iss y">⚠️ Dữ liệu hiện chỉ nằm trong <b>trình duyệt này</b> — đổi trình duyệt/máy sẽ không thấy. Sao lưu lần cuối: ${meta.lastBackup?new Date(meta.lastBackup).toLocaleString('vi-VN'):'chưa từng'}. Mở trình duyệt mới? Hãy bấm "Mở file dữ liệu" / "Khôi phục" để lấy lại dữ liệu.<div class=acts style="margin:8px 0 0">${fsBtns()}</div></div>`}
const updBar=()=>{const e=$('#bn');if(e)e.innerHTML=barInner()};
/* ===== 2e. ĐỒNG BỘ ĐA THIẾT BỊ (Firebase Realtime Database qua REST, không cần SDK) =====
 Cloud lưu {rev, data:<chuỗi JSON của S>}. meta.base = rev lần cuối máy này đồng bộ; meta.cd = 1 nếu máy này có thay đổi chưa gửi lên.
 Mở app / quay lại tab / mỗi 30s: nếu rev trên cloud khác base → (không có thay đổi cục bộ) tự tải về; (có thay đổi cục bộ) hỏi người dùng. */
let cs=meta.cloud?'wait':'off',ct,cbusy=false,cReady=false,cpoll;
const cU=(p,b)=>(b||meta.cloud).replace(/\/+$/,'')+(p||'')+'.json';
async function cGet(p,b){const r=await fetch(cU(p,b),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function cPush(){const rev=Date.now(),r=await fetch(cU(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rev,data:JSON.stringify(S)})});if(!r.ok)throw new Error('HTTP '+r.status);meta.base=rev;meta.cd=0;meta.lastCloud=Date.now();saveMeta();cs='ok';updBar()}
async function cPull(){const j=await cGet();let d=null;try{d=JSON.parse(j.data)}catch(e){}if(!d||!d.shippers||!d.shifts)throw new Error('bad data');S={avail:{},weeks:{},log:[],schedule:[],...d};normS();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}meta.base=j.rev;meta.cd=0;meta.lastCloud=Date.now();saveMeta();cs='ok';render()}
function cloudMark(){if(!meta.cloud||!cReady)return;meta.cd=1;saveMeta();cs='wait';updBar();clearTimeout(ct);ct=setTimeout(cloudSync,1500)}
function cConflict(){if($('#dg').style.display=='flex')return;ui.cb=null;$('#dgb').innerHTML=`<div style="white-space:pre-line;line-height:1.5">Máy khác đã cập nhật dữ liệu, trong khi máy này cũng có thay đổi chưa đồng bộ.\nChọn bản nào để giữ?</div><div class=ac><button class=b onclick="dgClose();cPush().catch(()=>{cs='err';updBar()})">Giữ bản máy này (ghi đè cloud)</button><button class="b pr" onclick="dgClose();cPull().catch(()=>{cs='err';updBar()})">Lấy bản trên cloud</button></div>`;$('#dg').style.display='flex'}
async function cloudSync(){
 if(!meta.cloud||cbusy)return;cbusy=true;
 try{
  const rev=await cGet('/rev');
  if(rev==null)await cPush();
  else if(rev!==meta.base){
   if(meta.cd)cConflict();
   else if(!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))await cPull();
  }
  else if(meta.cd)await cPush();
  else{cs='ok';updBar()}
 }catch(e){cs='err';updBar()}
 cbusy=false}
function cStartPoll(){clearInterval(cpoll);cpoll=setInterval(()=>{if(!document.hidden){cloudSync();pubSync()}},30000)}
async function cloudInit(){
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudSync()});addEventListener('online',()=>cloudSync());
 if(!meta.cloud)return;await cloudSync();cReady=true;cStartPoll();pubSync();pubMark()}
const CLOUD_DB='https://quanlyshipyumgo-default-rtdb.firebaseio.com';
async function cKey(c){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('yumgo|'+c.trim().toLowerCase()));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
async function cloudSetup(){
 const cur=meta.code||'';
 let v=prompt(meta.cloud?'MÃ SỐ đồng bộ của máy này (nhập đúng mã này trên máy/điện thoại khác).\nXóa trống rồi bấm OK để TẮT đồng bộ:':'Nhập MÃ SỐ đồng bộ do bạn tự đặt (ít nhất 8 ký tự, nên gồm cả chữ và số, không phân biệt hoa thường).\nMáy/điện thoại khác nhập cùng mã này sẽ dùng chung dữ liệu:',cur);
 if(v===null)return;v=v.trim();
 if(!v){clearInterval(cpoll);meta.cloud='';meta.code='';meta.base=0;meta.cd=0;saveMeta();cs='off';render();return toast('Đã tắt đồng bộ đám mây trên máy này')}
 if(meta.cloud&&v==cur)return;
 if(v.length<8)return toast('Mã số cần ít nhất 8 ký tự','er');
 if(!(window.crypto&&crypto.subtle))return toast('Cần mở app bằng địa chỉ https:// để dùng mã số','er');
 let u;try{u=CLOUD_DB+'/yumgo/'+await cKey(v)}catch(e){return toast('Không xử lý được mã số','er')}
 const on=async(fn,okMsg)=>{try{meta.cloud=u;meta.code=v;meta.base=0;meta.cd=0;await fn();cReady=true;cStartPoll();render();toast(okMsg)}catch(e){meta.cloud='';meta.code='';saveMeta();cs='off';render();toast('Không đồng bộ được, thử lại sau','er')}};
 try{
  const rev=await cGet('/rev',u);
  if(rev==null)ask('Mã này CHƯA có dữ liệu trên cloud.\n• Nếu đây là máy đang có dữ liệu thật: bấm "Tải lên".\n• Nếu bạn đang nhập mã trên máy thứ hai: có thể đã gõ sai mã, hãy bấm Hủy và nhập lại.',()=>on(cPush,'Đã bật đồng bộ và tải dữ liệu lên'),{ok:'Tải lên'});
  else ask('Mã này đã có dữ liệu trên cloud. Tải về và THAY THẾ dữ liệu hiện có trên thiết bị này?',()=>on(cPull,'Đã tải dữ liệu và bật đồng bộ'),{ok:'Tải về'})
 }catch(e){toast('Không kết nối được. Kiểm tra Rules của Firebase (cho phép đọc/ghi) và kết nối mạng','er')}}
const cloudBar=()=>{if(!meta.cloud)return'';const t=meta.lastCloud?' · '+new Date(meta.lastCloud).toLocaleTimeString('vi-VN'):'';
 return cs=='err'?`<div class="iss y">☁️ Chưa đồng bộ được (mất mạng hoặc sai cấu hình). Thay đổi vẫn lưu trên máy này và sẽ tự gửi lại. <button class=b onclick=cloudSync()>Thử lại</button></div>`:(cs=='wait'||meta.cd)?`<div class="iss y">☁️ Đang chờ đồng bộ…</div>`:`<div class="iss g">☁️ Đã đồng bộ${t}</div>`};
const barInner=()=>cloudBar()+barInner0();


/* ===== 2c. AVAILABILITY CARRY-OVER =====
 Khi mở một tuần chưa có dữ liệu rảnh nào, tự sao chép (snapshot) từ tuần gần nhất đã có dữ liệu (ưu tiên tuần trước).
 Sau đó mỗi tuần độc lập: sửa tay tuần này không làm đổi tuần khác. */
const weekHasAv=w=>{const e=addD(w,6),cb=CB();return Object.keys(S.avail).some(k=>{const d=k.slice(0,10);return d>=w&&d<=e&&kBld(k)==cb})};
function findSrc(w,backOnly){for(let i=1;i<=104;i++)if(weekHasAv(addD(w,-7*i)))return addD(w,-7*i);
 if(!backOnly)for(let i=1;i<=104;i++)if(weekHasAv(addD(w,7*i)))return addD(w,7*i);return null}
function copyAv(from,to){const cb=CB(),ks=Object.keys(S.avail).filter(k=>kBld(k)==cb),e=addD(from,6);
 ks.filter(k=>{const d=k.slice(0,10);return d>=to&&d<=addD(to,6)}).forEach(k=>delete S.avail[k]);
 const off=Math.round((pd(to)-pd(from))/864e5);
 ks.forEach(k=>{const d=k.slice(0,10);if(d>=from&&d<=e)S.avail[addD(d,off)+k.slice(10)]=S.avail[k]})}
function ensureAv(w){if(weekHasAv(w))return;const src=findSrc(w);if(!src)return;copyAv(src,w);save();
 setTimeout(()=>toast(`Đã tự động lấy lịch rảnh từ tuần ${fd(src)} – ${fd(addD(src,6))}. Sửa tay nếu cần.`),0)}
function reCopy(){const w=ui.week,src=weekHasAv(addD(w,-7))?addD(w,-7):findSrc(w,true);if(!src)return toast('Không có tuần trước để sao chép','er');
 ask(`Ghi đè lịch rảnh tuần này bằng lịch tuần ${fd(src)} – ${fd(addD(src,6))}?`,()=>{copyAv(src,w);commit();toast('Đã sao chép lịch rảnh')},{ok:'Sao chép'})}

/* ===== 3. DOMAIN ACCESSORS ===== */
const av=(d,sid,shid)=>S.avail[avk(d,sid,shid)]||'U'; // chưa nhập = Unavailable
const nm=id=>(S.shippers.find(x=>x.id==id)||{name:'(đã xóa)'}).name;
const weekEntries=w=>{const cb=CB();return S.schedule.filter(e=>e.date>=w&&e.date<=addD(w,6)&&bOf(e)==cb)};
const wkey=w=>CB()==B0?w:w+'|'+CB(),wstat=w=>S.weeks[wkey(w)]||'DRAFT';
const activeShifts=()=>S.shifts.filter(x=>x.active);

/* ===== 4. CONFLICT DETECTION / HARD CONSTRAINTS =====

const pk=s=>String((s&&s.name)||s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/\s+/g,' ').trim(),sibIds=s=>S.shippers.filter(x=>pk(x)==pk(s)).map(x=>x.id); // cùng tên = cùng một người ở các tòa khác nhau
function chk(e,en){const s=S.shippers.find(x=>x.id==e.shipperId),v=[];if(!s)return['Shipper không tồn tại'];

 if(av(e.date,s.id,e.shiftId)=='U')v.push('Assign khi Unavailable');
 if(en.some(x=>x.id!=e.id&&x.date==e.date&&x.shiftId==e.shiftId&&x.shipperId==s.id))v.push('Trùng ca');
 // Nhiều tòa nhà: primary của cùng shipper ở tòa khác trong tuần (chỉ tính khi có > 1 tòa)
 let ot=[];if(S.buildings.length>1){const bk=e.bid||CB(),a=mon(e.date),z=addD(a,6);ot=S.schedule.filter(x=>x.role=='primary'&&sibIds(s).includes(x.shipperId)&&x.date>=a&&x.date<=z&&bOf(x)!=bk)}
 if(e.role=='primary'){const cf=ot.find(x=>x.date==e.date&&x.shiftId==e.shiftId);if(cf)v.push('Trùng ca với tòa '+bName(bOf(cf)))}

/* chkP: như chk nhưng người được ⭐ Preferred ở ca đó (primary) được auto xếp kể cả khi vượt Daily/Weekly Max — vẫn bị cảnh báo ở Issues/Publish như cũ */

function issues(w){const en=weekEntries(w),o=[];

 weekDates(w).forEach((d,i)=>activeShifts().forEach(sh=>{const x=slotInfo(d,sh,en);if(x.miss)o.push({l:'r',m:`🔴 Ca ${sh.name} - ${DN[i]} (${fd(d)}): thiếu ${x.miss} shipper`})}));
 en.forEach(e=>{const v=chk(e,en),sh=S.shifts.find(x=>x.id==e.shiftId),lb=`${nm(e.shipperId)} · ${sh?sh.name:'?'} ${fd(e.date)}${e.role=='backup'?' (backup)':''}`;
  if(e.override)o.push({l:'p',m:`⚠️ Override: ${lb}${v.length?' — '+v.join(', '):''}${e.overrideReason?' · Lý do: '+esc(e.overrideReason):''}`});

/* Cảnh báo gom ca (chỉ đọc, không ghi dữ liệu): >2 shipper/ngày, hoặc cụm ca liền nhau chưa cùng người */
function grpWarn(w,en){const o=[];if(GC()===0)return o;
 weekDates(w).forEach((d,i)=>{const dp=en.filter(e=>e.date==d&&e.role=='primary'),ids=[...new Set(dp.map(e=>e.shipperId))];
  if(ids.length>GC())o.push({l:'y',m:`🔀 ${DN[i]} (${fd(d)}): có ${ids.length} shipper khác nhau (mục tiêu tối đa ${GC()}): ${ids.map(nm).join(', ')}`});
  CLUS.forEach(c=>{const a=S.shifts.find(x=>x.active&&cn(x)==c[0]),b=S.shifts.find(x=>x.active&&cn(x)==c[1]);if(!a||!b)return;
   const pa=dp.filter(e=>e.shiftId==a.id).map(e=>e.shipperId),pb=dp.filter(e=>e.shiftId==b.id).map(e=>e.shipperId);
   if(!pa.length||!pb.length||pa.some(x=>pb.includes(x)))return;

   o.push({l:'y',m:`🔀 ${DN[i]} (${fd(d)}): ca ${a.name} và ${b.name} chưa cùng một người (${pa.map(nm).join(', ')} / ${pb.map(nm).join(', ')}) — ${ok?'có shipper khả dụng cả 2 ca, có thể chỉnh tay hoặc bấm Tính lại':'không có shipper nào khả dụng cả 2 ca hoặc đã chạm giới hạn ca'}`})})});

 weekDates(w).forEach((d,i)=>{const db=en.filter(e=>e.date==d&&e.role=='backup'),bids=[...new Set(db.map(e=>e.shipperId))];
  if(S.settings.bkWarn&&bids.length>GC())o.push({l:'y',k:'b',m:`🔀 ${DN[i]} (${fd(d)}): backup có ${bids.length} shipper khác nhau (mục tiêu tối đa 2): ${bids.map(nm).join(', ')}`});
  CLUS.forEach(c=>{const a=S.shifts.find(x=>x.active&&cn(x)==c[0]),b=S.shifts.find(x=>x.active&&cn(x)==c[1]);if(!a||!b)return;
   const ba=db.filter(e=>e.shiftId==a.id).map(e=>e.shipperId),bb=db.filter(e=>e.shiftId==b.id).map(e=>e.shipperId);
   if(S.settings.bkWarn&&ba.length&&bb.length&&!ba.some(x=>bb.includes(x)))o.push({l:'y',k:'b',m:`🔀 ${DN[i]} (${fd(d)}): backup ca ${a.name} và ${b.name} chưa cùng một người (${ba.map(nm).join(', ')} / ${bb.map(nm).join(', ')})`})})});
 /* Cấu hình ca không tương thích với mục tiêu gom ca → chỉ cảnh báo, không tự sửa cấu hình */

  if(a&&b&&(a.requiredShippers!=b.requiredShippers))o.push({l:'y',k:'c',m:`⚙️ Cụm ${a.name}+${b.name}: số shipper bắt buộc (${a.requiredShippers} / ${b.requiredShippers}) không khớp mục tiêu 1 người phụ trách cả cụm — chỉ gom được một phần, hãy kiểm tra mục Cấu hình`})});

/* ===== 5. SCHEDULER (deterministic) =====
 Ưu tiên: ⭐ PREFERRED (người có sao = chính thức/primary của ca đó, người không sao = backup; kể cả khi trái quy tắc gom ca/cân bằng; ca không ai có sao thì mới dùng người không sao làm primary để đủ người) > gom ca > COVERAGE > BALANCE > TARGET. Hard constraint không bị phá bởi auto (NGOẠI LỆ: người có ⭐ được xếp primary kể cả vượt Daily/Weekly Max, chỉ cảnh báo) (chỉ Manager override). */
/* ----- Gom ca liền nhau (chỉ là ƯU TIÊN khi chọn người; không bao giờ phá hard constraint) -----
 Cụm: 11h+12h và 18h+19h (theo tên ca). Ca không thuộc cụm nào giữ nguyên hành vi cũ. */
const CLUS=[['11h','12h'],['18h','19h']],cn=x=>String(x&&x.name||'').trim().toLowerCase();
function partnerShift(shid){const sh=S.shifts.find(x=>x.id==shid);if(!sh||!sh.active)return null;const c=CLUS.find(p=>p.includes(cn(sh)));if(!c)return null;
 const o=c[c[0]==cn(sh)?1:0];return S.shifts.find(x=>x.active&&cn(x)==o)||null}
const cmpK=(p,q)=>{p=p||[];q=q||[];for(let i=0;i<Math.max(p.length,q.length);i++)if((p[i]||0)!=(q[i]||0))return(p[i]||0)-(q[i]||0);return 0};
function grpKeys(d,shid,en,list){const ps=partnerShift(shid),dp=en.filter(e=>e.role=='primary'&&e.date==d),dset=new Set(dp.map(e=>e.shipperId)),
 pp=ps?dp.filter(e=>e.shiftId==ps.id):[],pOpen=!!ps&&slotInfo(d,ps,en).miss>0,g={};
 list.forEach(x=>{const mine=dp.filter(e=>e.shipperId==x.id).length,withP=pp.some(e=>e.shipperId==x.id);
  let k1=dset.size>=2&&!dset.has(x.id)?1:0, // đã đủ 2 người trong ngày → ưu tiên người đang làm trong ngày
   k2=mine>=(x.dailyMax||2)?1:0, // tránh dồn thêm ca cho người đã đủ Daily Max/ngày
   k3=ps&&!withP?1:0, // ưu tiên người đã nhận ca đối tác trong cụm
   k5=0;
  if(pOpen&&!withP){const pe={id:'~p',date:d,shiftId:ps.id,role:'primary',shipperId:x.id};
   k5=(av(d,x.id,ps.id)!='U'&&!chk(pe,en.concat([{id:'~',date:d,shiftId:shid,role:'primary',shipperId:x.id},pe])).length)?0:1} // ưu tiên người làm được cả 2 ca của cụm
  g[x.id]=[k1,k2,k3,k5]});return g}
/* Gom ca cho BACKUP (cùng logic với primary): ưu tiên cùng một người dự phòng cho cả cụm (11h+12h, 18h+19h), tối đa 2 người backup/ngày,
 tránh dồn quá Daily Max ca dự phòng cho một người. Chỉ là thứ tự ưu tiên, không bao giờ phá điều kiện khả dụng. */
function bkKeys(d,shid,en,list){const ps=partnerShift(shid),db=en.filter(e=>e.role=='backup'&&e.date==d),bset=new Set(db.map(e=>e.shipperId)),
 pb=ps?db.filter(e=>e.shiftId==ps.id):[],pOpen=!!ps&&!pb.length&&!slotInfo(d,ps,en).miss,g={};
 list.forEach(x=>{const mine=db.filter(e=>e.shipperId==x.id).length,
  k1=GC()&&bset.size>=GC()&&!bset.has(x.id)?1:0, // đã đủ 2 người backup trong ngày → ưu tiên người đang backup trong ngày
  k2=mine>=(x.dailyMax||2)?1:0, // không dồn quá Daily Max ca dự phòng cho một người
  k3=pb.length&&!pb.some(e=>e.shipperId==x.id)?1:0, // ưu tiên người đã là backup của ca đối tác trong cụm
  k4=pOpen&&!(av(d,x.id,ps.id)!='U'&&!en.some(e=>e.date==d&&e.shiftId==ps.id&&e.shipperId==x.id))?1:0; // ưu tiên người backup được cả 2 ca của cụm
  g[x.id]=[k1,k2,k3,k4]});return g}
function cands(d,shid,en,role){const ne={id:'~',date:d,shiftId:shid,role},all=S.schedule;
 const wc=id=>en.filter(e=>e.role=='primary'&&e.shipperId==id).length+xw(id,d),tc=id=>all.filter(e=>e.role==role&&e.shipperId==id).length;
 const list=bShippers().filter(s=>s.active&&av(d,s.id,shid)!='U'&&!chkP({...ne,shipperId:s.id},en.concat([{...ne,shipperId:s.id}])).length),gk=role=='primary'?grpKeys(d,shid,en,list):bkKeys(d,shid,en,list);
 return list
 .sort((a,b)=>{const pf=x=>av(d,x.id,shid)=='P'?0:1,un=x=>wc(x.id)<x.weeklyTarget?0:1;
  const k=role=='primary'?(pf(a)-pf(b))||cmpK(gk[a.id],gk[b.id])||(wc(a.id)-wc(b.id))||(un(a)-un(b))||(tc(a.id)-tc(b.id)):(pf(b)-pf(a))||cmpK(gk[a.id],gk[b.id])||(tc(a.id)-tc(b.id))||(wc(a.id)-wc(b.id)); // backup: người KHÔNG ⭐ làm backup trước
  return k||a.name.localeCompare(b.name,'vi')||(a.id<b.id?-1:1)})}
function addEntry(d,shid,sid,role,extra){const t=new Date().toISOString();const e={id:uid('E'),bid:CB(),date:d,shiftId:shid,shipperId:sid,role,override:false,overrideReason:'',createdAt:t,updatedAt:t,...extra};S.schedule.push(e);return e}
const GC=()=>S.settings.gc==null?2:S.settings.gc,bcOf=sh=>sh.backupCount==null?1:sh.backupCount;
function runScheduler(w,mode){ // mode: 'auto' (xếp lại toàn tuần) | 'recalc' (chỉ thay slot bị ảnh hưởng)
 const all=weekEntries(w).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.createdAt<b.createdAt?-1:1),kept=[];
 // Auto: chỉ giữ Override của Manager. Recalc: giữ mọi entry còn hợp lệ (theo thứ tự), bỏ entry bị ảnh hưởng.
 // Recalc: ca nào có người ⭐ thì bỏ primary không-sao và backup có-sao (không Override) để ⭐ được xếp lại vào primary
 const starSlot=e=>bShippers().some(x=>x.active&&av(e.date,x.id,e.shiftId)=='P'),isP=e=>av(e.date,e.shipperId,e.shiftId)=='P',
  stale=e=>!e.override&&starSlot(e)&&((e.role=='primary'&&!isP(e))||(e.role=='backup'&&isP(e)));
 all.forEach(e=>{if(e.override||(mode=='recalc'&&!stale(e)&&!chkP(e,kept.concat([e])).length))kept.push(e)});

   if(!best||hp<best.hp||(hp==best.hp&&c.length<best.c.length))best={s,c,hp}});
  if(!best)break;addEntry(best.s.d,best.s.sh.id,best.c[0].id,'primary')}

}
function run(mode){const w=ui.week,st=wstat(w);
 if(st=='LOCKED')return toast('Tuần đã LOCKED — bộ xếp lịch không được thay đổi. Mở khóa hoặc chỉnh thủ công.','er');
 if(mode=='auto'&&st=='PUBLISHED')return ask('Lịch đã PUBLISHED. Xếp lại sẽ thay đổi lịch (các ca Override được giữ). Tiếp tục?',()=>doRun(mode));

function doRun(mode){const w=ui.week;

 const n=issues(w).filter(i=>i.l=='r').length;toast(n?`Hoàn tất — còn ${n} ca thiếu shipper`:'Hoàn tất — tất cả ca đã đủ người',n?'er':'')}

/* ===== 6. MANUAL EDIT + OVERRIDE ===== */
function guard(e,others,cb){const v=chk(e,others.concat([e]));if(wstat(mon(e.date))=='LOCKED')v.push('Lịch đã LOCKED');
 if(!v.length)return cb({});if(!S.settings.allow)return toast('Không hợp lệ: '+v.join('; '),'er');

 const wc=id=>en.filter(e=>e.role=='primary'&&e.shipperId==id).length+xw(id,d),taken=en.filter(e=>e.date==d&&e.shiftId==shid).map(e=>e.shipperId);

 modal(`<h3>Ca ${esc(sh.name)} · ${DN[(pd(d).getDay()+6)%7]} ${fd(d)} · cần ${sh.requiredShippers}</h3>${x.miss?`<div class="iss r">🔴 Thiếu ${x.miss} shipper</div>`:''}${x.p.concat(x.b).map(row).join('')||'<p class=sm>Chưa có ai.</p>'}

/* ===== 7. WEEK STATUS ===== */
function setStatus(st){const w=ui.week,f=()=>{S.weeks[wkey(w)]=st;log(`[${bName(CB())}] Tuần ${w} → ${st}`);commit()};
 if(st=='LOCKED')ask('Chốt (LOCK) lịch tuần này? Auto scheduler sẽ không thay đổi được nữa.',f,{ok:'Lock'});else if(st=='PUBLISHED')pubCheck(w,f);else f()}

/* ===== 7b. KIỂM TRA TRƯỚC KHI PUBLISH (chỉ đọc dữ liệu, không ghi) =====

function validateWeek(w){const en=weekEntries(w),E=[],W=[],I=[],ds=weekDates(w),shs=activeShifts(),di=e=>{const i=ds.indexOf(e.date);return(i>=0?DN[i]+' ':'')+fd(e.date)};
 en.forEach(e=>{const s=S.shippers.find(x=>x.id==e.shipperId),c=S.shifts.find(x=>x.id==e.shiftId);
  if(!s||!c||!e.date||!['primary','backup'].includes(e.role)){E.push(`❌ Dữ liệu phân công không hợp lệ (${esc(e.date||'?')} · ${c?esc(c.name):'ca không tồn tại'} · ${s?esc(s.name):'shipper không tồn tại'}) — lịch có thể hiển thị sai`);return}
  const v=chk(e,en);if(!v.length)return;const lb=`${di(e)} · Ca ${esc(c.name)} · ${esc(s.name)}${e.role=='backup'?' (backup)':''}`;
  if(e.override)W.push(`⚠️ Override đã được duyệt: ${lb} — ${v.join(', ')}${e.overrideReason?' · Lý do: '+esc(e.overrideReason):''}`);
  else E.push(`❌ ${lb}: ${v.join(', ')}`)});
 ds.forEach((d,i)=>shs.forEach(sh=>{const x=slotInfo(d,sh,en);if(x.miss)E.push(`❌ ${DN[i]} ${fd(d)} · Ca ${esc(sh.name)}: thiếu ${x.miss} shipper chính (cần ${sh.requiredShippers})`)}));
 let over=0,okd=0;ds.forEach(d=>{const n=new Set(en.filter(e=>e.date==d&&e.role=='primary').map(e=>e.shipperId)).size;if(GC()&&n>GC())over++;else if(n)okd++});
 const gw=grpWarn(w,en);gw.forEach(x=>W.push(x.m));
 const nb=ds.reduce((a,d)=>a+shs.filter(sh=>{const x=slotInfo(d,sh,en);return !x.miss&&x.b.length<bcOf(sh)}).length,0);
 I.push(`ℹ️ ${okd}/${ds.length} ngày đạt mục tiêu ≤ ${GC()||'∞'} shipper/ngày · ${over} ngày vượt mục tiêu · ${gw.filter(x=>!x.k).length-over} cụm ca liền nhau chưa gom được`);
 if(nb)I.push(`ℹ️ ${nb} ca chưa có shipper dự phòng`);
 return{E,W,I}}
function pubCheck(w,f){const r=validateWeek(w),L=(a,c)=>a.map(m=>`<div class="iss ${c}">${m}</div>`).join('');
 if(!r.E.length&&!r.W.length){f();return toast(r.I[0].replace('ℹ️ ',''))}

function schedCanvas(){const w=ui.week,en=weekEntries(w),ds=weekDates(w),sh=activeShifts(),SC=2,W=1280,M=36,CP=32,LW=112,GAP=4,
 FN='"Nunito","Segoe UI",Roboto,Arial,sans-serif',DAYN=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'],
 /* Bảng màu theo mẫu: cam (tiêu đề cột) · xanh nhạt (ô có ca) · nền trắng/xám nhạt */
 OR='#E8963A',OR2='#FCEBD5',OR3='#B8641A',BL='#D9ECF7',BL2='#BBD9EC',NAVY='#1E3A52',MUT='#5F7F9B',INK='#1F2937',
 IW=W-M*2-CP*2,dw=(IW-LW)/7,LH=26;
 const m0=document.createElement('canvas').getContext('2d');if(!m0)throw new Error('canvas');
 const wrap=(t,f,mw)=>{m0.font=f;const out=[];let cur='';String(t).split(/\s+/).forEach(wd=>{const tt=cur?cur+' '+wd:wd;if(m0.measureText(tt).width<=mw||!cur)cur=tt;else{out.push(cur);cur=wd}});if(cur)out.push(cur);return out};
 const B='bold 19px '+FN,N='15px '+FN;
 const cellLines=(d,s)=>{const x=slotInfo(d,s,en),L=[];
  x.p.forEach(e=>wrap(nm(e.shipperId),B,dw-GAP*2-8).forEach(t=>L.push({t,f:B,c:NAVY})));
  if(x.miss)L.push({t:'Thiếu '+x.miss,f:B,c:'#C2410C'});
  x.b.forEach(e=>wrap('BK: '+nm(e.shipperId),N,dw-GAP*2-8).forEach(t=>L.push({t,f:N,c:MUT})));return{L,miss:!!x.miss}};
 const rows=sh.map(s=>{const cs=ds.map(d=>cellLines(d,s));return{s,cs,h:Math.max(84,...cs.map(c=>c.L.length*LH+26))}});
 const TOP=84,HH=64,FH=64,CH=CP+TOP+14+HH+rows.reduce((a,r)=>a+r.h,0)+FH,H=CH+M*2,cv=document.createElement('canvas');cv.width=W*SC;cv.height=H*SC;
 const c=cv.getContext('2d');if(!c)throw new Error('canvas');c.scale(SC,SC);c.textBaseline='middle';

 return tabs+cards+`<p class=sm>🟢 Đủ · 🔴 Thiếu · 🟣 Override · Chạm vào ca để chọn shipper / backup / xóa.</p>`}

/* ===== 11. LƯƠNG (tính từ lịch đã PUBLISHED/LOCKED của mọi tòa; tuần DRAFT chưa tính) ===== */
const vnd=n=>Math.round(n||0).toLocaleString('vi-VN')+'đ',fm=m=>m.slice(5)+'/'+m.slice(0,4);
const wkSt=(w,b)=>S.weeks[b==B0?w:w+'|'+b]||'DRAFT';
const bPay=bid=>{const b=S.buildings.find(x=>x.id==bid)||{};return{mode:b.payMode||'ca',rate:b.rate}};
const rateOf=(s,sh,bid)=>s&&s.rate!=null?s.rate:(sh&&sh.rate!=null?sh.rate:(bPay(bid).rate!=null?bPay(bid).rate:(S.settings.rate==null?40000:S.settings.rate)));
const payMonth=()=>ui.pm||(ui.pm=iso(new Date()).slice(0,7));
/* S.payMod[entryId]={ex:1}(bỏ khỏi lương) | {amt:n}(đổi tiền ca); S.payAdd=[ca thêm thủ công]; S.adj=[phụ cấp/trừ tiền] — chỉ ảnh hưởng bảng lương, không đổi lịch xếp */
function payCalc(m){const rows={};let draft=0;
 const rw=s=>rows[s.id]=rows[s.id]||{sid:s.id,name:s.name,bid:sBid(s),ca:0,bk:0,amt:0,adj:0,det:[],ex:[]};
 S.schedule.forEach(e=>{if(e.date.slice(0,7)!=m)return;
  if(wkSt(mon(e.date),bOf(e))=='DRAFT'){draft++;return}
  const s=S.shippers.find(x=>x.id==e.shipperId);if(!s)return;
  const r=rw(s),sh=S.shifts.find(x=>x.id==e.shiftId),isP=e.role=='primary',md=S.payMod[e.id]||{},bp=bPay(bOf(e)),don=isP&&bp.mode=='don',rt=rateOf(s,sh,bOf(e)),od=don?(md.orders||0):null,base=isP?(don?od*rt:rt):(S.settings.rateB||0),p=md.amt!=null?md.amt:base;
  if(md.ex){r.ex.push({id:e.id,d:e.date,c:sh?sh.name:'?'});return}
  if(isP)r.ca++;else r.bk++;r.amt+=p;if(don)r.od=(r.od||0)+od;r.det.push({id:e.id,d:e.date,c:sh?sh.name:'?',role:e.role,b:bOf(e),p,ed:md.amt!=null,o:od,rt:don?rt:null})});
 S.payAdd.filter(a=>a.m==m).forEach(a=>{const s=S.shippers.find(x=>x.id==a.sid);if(!s)return;const r=rw(s);if(a.role=='primary')r.ca++;else r.bk++;r.amt+=a.amt;r.det.push({aid:a.id,d:a.date,c:a.shift,role:a.role,b:a.bid,p:a.amt,man:1,note:a.note})});
 S.adj.filter(a=>a.m==m).forEach(a=>{const s=S.shippers.find(x=>x.id==a.sid);if(s)rw(s).adj+=a.amt});
 const list=Object.values(rows).map(r=>({...r,days:new Set(r.det.filter(x=>x.role=='primary').map(x=>x.d)).size,total:r.amt+r.adj,det:r.det.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)})).sort((a,b)=>a.name.localeCompare(b.name,'vi'));
 return{list,draft}}
const payList=m=>{const lk=S.payLock[m];return lk?{list:lk.rows,draft:0,lk}:payCalc(m)};
const payNav=n=>{const d=pd(payMonth()+'-01');d.setMonth(d.getMonth()+n);ui.pm=iso(d).slice(0,7);render()};
const setShRate=(id,v)=>{const s=S.shippers.find(x=>x.id==id);s.rate=v===''?null:Math.max(0,+v||0);commit()};
function addAdj(){const sid=$('#aj_s').value,a=+$('#aj_a').value;if(!sid||!a)return toast('Chọn shipper và nhập số tiền khác 0','er');S.adj.push({id:uid('J'),m:payMonth(),sid,amt:a,note:$('#aj_n').value.trim(),t:new Date().toISOString()});log('Điều chỉnh lương '+nm(sid)+' '+a);commit()}
const delAdj=id=>{S.adj=S.adj.filter(a=>a.id!=id);commit()};
/* sửa / bỏ / khôi phục từng dòng ca trong bảng lương */
function payEd(eid,aid){const L=payList(payMonth()).list;let x=null;L.forEach(r=>r.det.forEach(y=>{if((eid&&y.id==eid)||(aid&&y.aid==aid))x=y}));if(!x)return;
 const isO=x.o!=null,v=prompt(isO?'Số đơn của ca này (tiền = số đơn × '+vnd(x.rt)+'):':'Số tiền cho ca này (đ):',isO?x.o:x.p);if(v===null)return;const n=Math.max(0,+String(v).replace(/[^\d.]/g,'')||0);
 if(aid){const a=S.payAdd.find(y=>y.id==aid);if(a)a.amt=n}else{const md=S.payMod[eid]=S.payMod[eid]||{};if(isO){md.orders=n;delete md.amt}else md.amt=n}log('Sửa lương ca '+n);commit()}
function payOrdersBulk(sid){const r=payList(payMonth()).list.find(x=>x.sid==sid),ls=r?r.det.filter(x=>x.o!=null&&x.id):[];if(!ls.length)return toast('Người này không có ca tính theo đơn','er');
 const v=prompt(`Dán số đơn của ${ls.length} ca theo thứ tự ngày (cách nhau bằng dấu cách, xuống dòng hoặc dấu phẩy):`);if(v===null)return;const ns=v.split(/[\s,;]+/).filter(Boolean).map(x=>Math.max(0,+x||0));
 if(ns.length!=ls.length&&!confirm(`Bạn nhập ${ns.length} số nhưng có ${ls.length} ca. Vẫn áp dụng cho ${Math.min(ns.length,ls.length)} ca đầu?`))return;
 ls.forEach((x,i)=>{if(i<ns.length){const md=S.payMod[x.id]=S.payMod[x.id]||{};md.orders=ns[i];delete md.amt}});log('Nhập số đơn hàng loạt '+r.name);commit()}
const payDel=(eid,aid)=>{if(aid)S.payAdd=S.payAdd.filter(x=>x.id!=aid);else S.payMod[eid]={ex:1};log('Bỏ ca khỏi lương');commit()};
const payRst=eid=>{delete S.payMod[eid];commit()};
function payAddForm(sid){const m=payMonth(),s=S.shippers.find(x=>x.id==sid);
 modal(`<h3>+ Thêm ca thủ công — ${esc(s.name)}</h3><div class=fg><label>Ngày<input id=pa_d type=date min="${m}-01" max="${m}-31" value="${m}-01"></label><label>Ca<select id=pa_c>${S.shifts.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select></label><label>Khu<select id=pa_b>${S.buildings.map(b=>`<option value="${b.id}" ${b.id==sBid(s)?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label><label>Vai trò<select id=pa_r><option value=primary>Ca chính</option><option value=backup>Backup</option></select></label><label>Số tiền (đ)<input id=pa_a type=number value="${rateOf(s)}"></label><label>Ghi chú<input id=pa_n></label></div><div class=ac><button class=b onclick=closeModal()>Hủy</button><button class="b pr" onclick="payAddGo('${sid}')">Thêm</button></div>`)}

const apBadge=()=>pubInfo.rt?(Date.now()-pubInfo.rt<25*6e4?`<div class="iss g">🟢 Autopilot (máy chủ tự động) chạy lần cuối lúc ${new Date(pubInfo.rt).toLocaleTimeString('vi-VN')}</div>`:`<div class="iss y">🟠 Autopilot chưa chạy lại từ ${new Date(pubInfo.rt).toLocaleString('vi-VN')} — kiểm tra GitHub Actions</div>`):'<div class=sm>Autopilot: chưa bật — yêu cầu của shipper chỉ được xử lý khi file này đang mở.</div>';
const regCard=()=>{const ap=apBadge(),w=addD(mon(new Date()),7),seen=new Set(),L=S.shippers.filter(s=>s.active&&!seen.has(pk(s))&&seen.add(pk(s))),has=s=>S.shippers.some(x=>pk(x)==pk(s)&&S.regLog[w+'|'+x.id]),ok=L.filter(has),no=L.filter(s=>!has(s));
 return`<div class=card><h3>✍️ Shipper đăng ký — tuần ${fd(w)}</h3><div class=sm>Đã đăng ký (${ok.length}): ${ok.map(s=>esc(s.name)).join(', ')||'—'}</div><div class=sm style="margin-top:4px">Chưa đăng ký (${no.length}): ${no.map(s=>esc(s.name)).join(', ')||'—'}</div>${ap}<div class=acts style="margin-top:10px"><button class=b onclick="pubCheckNow()">🔄 Kiểm tra yêu cầu shipper ngay</button></div><p class=sm>${pubInfo.t?'Lần kiểm tra cuối trên máy này: '+new Date(pubInfo.t).toLocaleTimeString('vi-VN')+(pubInfo.err?' — <b style="color:var(--er)">LỖI: '+esc(pubInfo.err)+'</b>':' — '+pubInfo.n+' yêu cầu mới'):'Chưa kiểm tra lần nào trên máy này (tự kiểm tra mỗi 30 giây khi mở file).'} Lịch rảnh của shipper đã đăng ký xem ở mục <b>Lịch rảnh</b> (chọn đúng tòa và tuần).</p></div>`};
function avBanner(){const w=ui.week,L=bShippers().filter(s=>s.active),ok=L.filter(s=>S.regLog[w+'|'+s.id]),no=L.filter(s=>!S.regLog[w+'|'+s.id]),cur=mon(new Date()),other=[...new Set(Object.keys(S.regLog).map(k=>k.slice(0,10)).filter(x=>x!=w&&x>=cur))].sort();
 return`<div class=card style="padding:10px 14px"><b>✍️ Shipper tự đăng ký — tuần ${fd(w)} · ${esc(bName(CB()))}: ${ok.length}/${L.length} người</b>${ok.length?`<div class=sm>Đã đăng ký: ${ok.map(s=>esc(s.name)).join(', ')}</div>`:''}${no.length?`<div class=sm>Chưa đăng ký: ${no.map(s=>esc(s.name)).join(', ')} (giữ lịch rảnh cũ / sao chép từ tuần trước)</div>`:''}${other.length?`<div class=sm style="margin-top:4px">Có đăng ký cho tuần khác: ${other.map(x=>`<button class=b style="padding:2px 8px" onclick="ui.week='${x}';render()">${fd(x)}</button>`).join(' ')}</div>`:''}</div>`}
const rgB=sid=>S.regLog[ui.week+'|'+sid]?`<div class=sm style="color:var(--ok)">✍️ đã đăng ký ${new Date(S.regLog[ui.week+'|'+sid]).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>`:'';
function goNote(id){const n=S.notices.find(x=>x.id==id);if(!n||!n.go)return;ui.week=n.go.w;ui.bld=n.go.b;meta.bld=n.go.b;saveMeta();n.seen=1;save();go('avail')}
const noticeBar=()=>{const n=S.notices.filter(x=>!x.seen);if(!n.length)return'';return`<div class=card style="border-color:var(--wr)"><div class=acts style="justify-content:space-between;margin:0 0 6px"><b>🔔 Thông báo (${n.length})</b><button class=b onclick="seeNotices()">Đã xem tất cả</button></div>${n.slice(-10).reverse().map(x=>`<div class="iss ${x.urgent?'r':'y'}">${esc(x.text)} ${x.go?`<button class=b style="padding:2px 8px" onclick="goNote('${x.id}')">Xem lịch rảnh →</button>`:''} <span class=sm>${new Date(x.t).toLocaleString('vi-VN')}</span></div>`).join('')}</div>`};
const seeNotices=()=>{S.notices.forEach(x=>x.seen=1);commit()};
async function spLink(){if(!meta.cloud||!meta.code)return toast('Hãy bật "Đồng bộ đa thiết bị" trước','er');const k=await pubKey();
 modal(`<h3>🔗 Link cho shipper</h3><label>Địa chỉ trang shipper (nơi bạn đưa file shipper.html lên)<input id=sp_u value="${esc(meta.spUrl||'')}" placeholder="https://ten-cua-ban.netlify.app/"></label><div class=acts style="justify-content:flex-start"><button class="b pr" onclick="spCopy('${k}')">Copy link</button></div><p class=sm>Trang shipper dùng một mã riêng, khác hẳn mã đồng bộ của bạn, nên shipper không đọc được dữ liệu lương.</p><label>Rules Firebase (Realtime Database → Rules → dán → Publish)<textarea rows=8 readonly onclick=this.select()>${esc(RULES)}</textarea></label><div class=ac><button class=b onclick=closeModal()>Đóng</button></div>`)}
function spCopy(k){const u=$('#sp_u').value.trim();if(!u)return toast('Nhập địa chỉ trang shipper','er');meta.spUrl=u;saveMeta();const l=u.replace(/#.*$/,'')+'#'+k;navigator.clipboard.writeText(l).then(()=>toast('Đã copy link — gửi vào nhóm Zalo shipper'),()=>prompt('Copy link:',l))}

/* ===== 13. TỰ ĐỘNG XẾP LỊCH TUẦN SAU: tới hạn đăng ký → (shipper chưa đăng ký thì giữ lịch rảnh tuần trước) → Auto → Publish nếu không có lỗi nghiêm trọng. Chạy khi file tổng đang mở. ===== */
function carryAv(w,bid){S.shippers.filter(s=>s.active&&sBid(s)==bid).forEach(s=>{const ds=[...Array(7)].map((_,i)=>addD(w,i));if(ds.some(d=>S.shifts.some(c=>S.avail[avk(d,s.id,c.id,bid)])))return;ds.forEach((d,i)=>{const p0=addD(w,i-7);S.shifts.forEach(c=>{const v=S.avail[avk(p0,s.id,c.id,bid)];if(v)S.avail[avk(d,s.id,c.id,bid)]=v})})})}
function autoRun(){if(!S||!S.settings||!S.settings.auto)return;const now=new Date(),dow=((now.getDay()+6)%7)+1,hr=now.getHours()+now.getMinutes()/60,adow=S.settings.adow||4,ahr=S.settings.ahr==null?20:S.settings.ahr;
 if(!(dow>adow||(dow==adow&&hr>=ahr)))return;const w=addD(mon(now),7);let ch=0;
 S.buildings.filter(b=>b.active).forEach(b=>{const k=w+'|'+b.id;if(S.autoDone[k])return;S.autoDone[k]=1;if(wkSt(w,b.id)!='DRAFT')return;
  inB(b.id,()=>{carryAv(w,b.id);runScheduler(w,'auto');const v=validateWeek(w);ch++;
   if(S.settings.apub!==0&&!v.E.length){S.weeks[wkey(w)]='PUBLISHED';log(`[${b.name}] Tự động xếp & Publish tuần ${w}`);S.notices.push({id:'auto'+k,t:Date.now(),text:`🤖 Đã tự xếp & Publish tuần ${fd(w)} — ${b.name}${v.W.length?` (còn ${v.W.length} cảnh báo)`:''}`,urgent:false,seen:0})}
   else{log(`[${b.name}] Tự động xếp tuần ${w} (chưa Publish)`);S.notices.push({id:'auto'+k,t:Date.now(),text:`🤖 Đã tự xếp tuần ${fd(w)} — ${b.name} nhưng CẦN XEM LẠI${v.E.length?` (${v.E.length} lỗi nghiêm trọng, chưa Publish)`:' (chưa Publish theo cài đặt)'}`,urgent:!!v.E.length,seen:0})}})});
 Object.keys(S.autoDone).forEach(k=>{if(k.slice(0,10)<addD(mon(now),-14))delete S.autoDone[k]});
 if(ch){save();if(!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))render()}}
setTimeout(autoRun,4000);setInterval(()=>{if(!document.hidden)autoRun()},60000);

function vCfg(){const s=S.settings,n=(k,v,t)=>`<label>${k[1]}<input type=number value="${v??''}" onchange="setSet('${k[0]}',this.value===''?null:+this.value)"></label>`;
 const si=(id,k,v,t)=>`<input type="${t||'text'}" value="${esc(v)}" onchange="updShift('${id}','${k}',this.value)" style="margin:0;min-width:${t=='number'?60:80}px">`;
 return hdr('Cấu hình')+`<div class=card><h3>General</h3><div class=fg style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">${n(['wt','Weekly Target mặc định'],s.wt)}${n(['dm','Daily Max mặc định'],s.dm)}${n(['wm','Weekly Max mặc định (trống = Unlimited)'],s.wm)}<label>Cho phép Override<select onchange="setSet('allow',this.value=='1')"><option value=1 ${s.allow?'selected':''}>ON</option><option value=0 ${s.allow?'':'selected'}>OFF</option></select></label>${n(['gc','Gom ca: tối đa người/ngày (0 = tắt cảnh báo)'],s.gc)}${n(['rate','Đơn giá mỗi ca (đ)'],s.rate)}${n(['rateB','Đơn giá backup không đi (đ)'],s.rateB)}${n(['late','Mốc nghỉ gấp (giờ trước ca)'],s.late)}<label>Tự động xếp lịch tuần sau<select onchange="setSet('auto',+this.value)"><option value=0 ${s.auto?'':'selected'}>Tắt</option><option value=1 ${s.auto?'selected':''}>Bật</option></select></label><label>Hạn đăng ký (ngày)<select onchange="setSet('adow',+this.value)">${[1,2,3,4,5,6,7].map(i=>`<option value=${i} ${(s.adow||4)==i?'selected':''}>${i<7?'Thứ '+(i+1):'Chủ nhật'}</option>`).join('')}</select></label>${n(['ahr','Hạn đăng ký (giờ, 0–23)'],s.ahr==null?20:s.ahr)}<label>Tự Publish nếu không có lỗi nghiêm trọng<select onchange="setSet('apub',+this.value)"><option value=1 ${s.apub===0?'':'selected'}>Có</option><option value=0 ${s.apub===0?'selected':''}>Không (chỉ xếp, bạn Publish)</option></select></label></div><div class=acts style="margin-top:10px"><button class=b onclick=applyDm()>Áp Daily Max mặc định cho tất cả shipper</button></div></div>${regCard()}
 <div class=card><h3>Shifts</h3><table><tr><th>Tên ca<th>Order cutoff<th>Delivery start<th>Delivery end<th>Required<th>Backup<th>Đơn giá ca (trống = mặc định)<th></tr>${S.shifts.map(c=>`<tr style="${c.active?'':'opacity:.5'}"><td>${si(c.id,'name',c.name)}<td>${si(c.id,'orderCutoff',c.orderCutoff,'time')}<td>${si(c.id,'deliveryStart',c.deliveryStart,'time')}<td>${si(c.id,'deliveryEnd',c.deliveryEnd,'time')}<td>${si(c.id,'requiredShippers',c.requiredShippers,'number')}<td>${si(c.id,'backupCount',c.backupCount==null?1:c.backupCount,'number')}<td>${si(c.id,'rate',c.rate==null?'':c.rate,'number')}<td><button class=b onclick="togShift('${c.id}')">${c.active?'Deactivate':'Activate'}</button>`).join('')}</table><div class=acts style="margin-top:10px"><button class="b pr" onclick=addShift()>+ Thêm ca</button></div><p class=sm>Required = số shipper chính mỗi ca (có thể 2 hoặc nhiều hơn). Backup = số người dự phòng mỗi ca (0 = không có; số lớn như 99 = tất cả người còn rảnh). Staffing chỉ dựa vào "Required". Số order/capacity (20/20, 50/50…) không được dùng để tính nhân sự.</p></div>
 <div class=card><h3>Dữ liệu</h3><div class=acts>${fsBtns()}<button class=b onclick=cloudSetup()>☁️ Đồng bộ đa thiết bị</button><button class=b onclick=spLink()>🔗 Link cho shipper</button><button class=b onclick="$('#imp').click()">⬆ Import JSON</button><button class=b onclick=resetDemo()>Reset Demo Data</button><button class="b dg" onclick=clearAll()>Clear All Data</button></div></div>`}

const mob=()=>meta.mob===undefined?innerWidth<=820:!!meta.mob,togMob=()=>{meta.mob=!mob();saveMeta();render()};
function render(){document.body.classList.toggle('mob',mob());ensureAv(ui.week);const V={dash:['Tổng quan',vDash],ship:['Shipper',vShip],avail:['Lịch rảnh',vAvail],sched:['Xếp lịch',vSched],bld:['Tòa nhà',vBld],pay:['Lương',vPay],cfg:['Cấu hình',vCfg]},ic={dash:'📊',ship:'🛵',avail:'🗓️',sched:'🤖',bld:'🏢',pay:'💰',cfg:'⚙️'};
 $('#nav').innerHTML=Object.keys(V).map(k=>`<a class="${ui.view==k?'on':''}" onclick="go('${k}')"><span class=ic>${ic[k]}</span><b>${V[k][0]}</b></a>`).join('');
 $('#main').innerHTML='<div class=vt><button class=b onclick=togMob()>'+(mob()?'🖥️ Giao diện máy tính':'📱 Giao diện điện thoại')+'</button></div><div id=bn>'+barInner()+'</div>'+noticeBar()+V[ui.view][1]()}
addEventListener('resize',()=>{if(meta.mob===undefined&&mob()!=document.body.classList.contains('mob'))render()});
load();save();render();initFile();cloudInit();
</script></body></html>
